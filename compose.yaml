services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: conformis
      POSTGRES_USER: conformis
      POSTGRES_PASSWORD: conformis
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conformis -d conformis"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - conformis_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: conformis
      MINIO_ROOT_PASSWORD: conformis-local-only
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - conformis_minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 conformis conformis-local-only &&
        mc mb --ignore-existing local/conformis-local

volumes:
  conformis_postgres_data:
  conformis_minio_data:
