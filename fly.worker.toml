primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.worker"

[env]
  NODE_ENV = "production"
  WORKER_REQUIRED = "true"
  OCR_COMMAND = "ocrmypdf"
  OCR_LANGUAGES = "deu+eng"
  OCR_JOBS = "2"
  OCR_PAGE_TIMEOUT_SECONDS = "120"
  OCR_TIMEOUT_MILLISECONDS = "600000"

[processes]
  worker = "pnpm worker:dev"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
  cpus = 2
  cpu_kind = "shared"
